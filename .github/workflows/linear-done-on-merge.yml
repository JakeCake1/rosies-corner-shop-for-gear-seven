# Moves the Linear issue of a merged PR to Done. Runs on GitHub, so it works while Claude Code is closed.
# A PR closed without merge does nothing. Nothing is merged here. See Docs/agent-workflow.md.
name: Linear - Done on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: Tools/Workflow
      - name: Move linked Linear issues to Done
        run: python3 Tools/Workflow/linear_done_on_merge.py
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
